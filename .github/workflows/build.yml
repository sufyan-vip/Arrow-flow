name: Build Arrow Flow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node & Capacitor Environment
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save

      - name: Ensure Capacitor Config
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Arrow Flow" "com.sufyan.arrowflow" --web-dir .
          fi

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate App Icons
        run: |
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android || true
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrow-flow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
